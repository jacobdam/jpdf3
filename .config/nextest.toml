# PROTECTED. Test runner config used by the judge (AUTOMATION.md §8: flaky handling).
[profile.ci]
retries = 1
fail-fast = false
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 5 }

[profile.ci.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true
